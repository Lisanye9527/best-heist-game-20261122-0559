<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gilded Vault — a top-down stealth heist</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #070a08;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
  }
  #wrap {
    width: min(100vw, calc(100vh * 1.6));
    max-width: 1280px;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #0e1512;
    cursor: crosshair;
  }
  #help {
    color: #9fb8a4;
    font-size: 13px;
    text-align: center;
    padding: 8px 4px 0;
  }
  #help b { color: #e8e3d3; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="800"></canvas>
    <div id="help">
      <b>WASD / arrows</b> move &nbsp;·&nbsp; <b>Shift</b> tiptoe &nbsp;·&nbsp;
      <b>E</b> lift loot &nbsp;·&nbsp; <b>click</b> toss a coin &nbsp;·&nbsp;
      <b>P</b> pause &nbsp;·&nbsp; <b>Enter</b> begin / play again
    </div>
  </div>
  <script type="module" src="./src/boot.js"></script>
</body>
</html>
