<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Gilded Vault: a tiny top-down stealth heist game. Cross the bank floor unseen, lift the Aurora Diamond, and escape to the van.">
<title>The Gilded Vault — a tiny heist</title>
<!-- The page loads nothing over the network: one canvas, one module script, all files local. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="The Gilded Vault: cross the bank floor unseen, lift the Aurora Diamond from the vault, and escape to the van. Move with WASD or the arrow keys, tiptoe with Shift, hold E to lift loot, click to toss a coin decoy."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
